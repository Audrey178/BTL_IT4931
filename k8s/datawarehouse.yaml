apiVersion: v1
kind: PersistentVolume
metadata:
  name: datawarehouse-pv
  labels:
    type: local
spec:
  storageClassName: manual-datawarehouse
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/volume_sgp1_01/datawarehouse-data"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datawarehouse-pvc
  namespace: batch
spec:
  storageClassName: manual-datawarehouse
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datawarehouse
  namespace: batch
  labels:
    app: datawarehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datawarehouse
  template:
    metadata:
      labels:
        app: datawarehouse
    spec:
      containers:
        - name: postgresql
          image: debezium/postgres:13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "warehousedb"
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "admin123"
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: datawarehouse-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: datawarehouse
  namespace: batch
spec:
  type: NodePort
  selector:
    app: datawarehouse
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30055