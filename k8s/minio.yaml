apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-minio
spec:
  capacity:
    storage: 80Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-slow
  hostPath:
    path: /mnt/volume_sgp1_01/minio-data
  # declare node affinity to bind PV to specific node
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - big-data  

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: batch
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-slow
  resources:
    requests:
      storage: 80Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: batch
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: Recreate # Bắt buộc với ReadWriteOnce/HostPath để tránh lỗi lock file
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # use node 1
      nodeSelector:
        node-role.kubernetes.io/manager: "true"

      # use init container to fix permissions of old data
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:1000 /data"]
        volumeMounts:
        - name: minio-data
          mountPath: /data
        securityContext:
          runAsUser: 0 # Chạy init container bằng quyền root để có thể sửa quyền file

      containers:
      - name: minio
        image: quay.io/minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          value: "minio"
        - name: MINIO_ROOT_PASSWORD
          value: "minio123"
        ports:
        - name: api
          containerPort: 9000
        - name: console
          containerPort: 9001
        
        # set resource requests and limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
            
        volumeMounts:
        - name: minio-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20
          
      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: minio-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: batch
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: api
    nodePort: 30900
  - name: console
    port: 9001
    targetPort: console
    nodePort: 30901
  type: NodePort