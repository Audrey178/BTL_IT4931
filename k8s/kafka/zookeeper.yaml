apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: batch
  labels:
    app: zookeeper
spec:
  ports:
  - port: 2181
    name: client
  - port: 2888
    name: peer
  - port: 3888
    name: leader-election
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: zookeeper
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: batch
  labels:
    app: zookeeper
spec:
  ports:
  - port: 2181
    name: client
  selector:
    app: zookeeper
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: batch
spec:
  selector:
    matchLabels:
      app: zookeeper
  serviceName: zookeeper-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.6.0
        ports:
        - containerPort: 2181
          name: client
        - containerPort: 2888
          name: peer
        - containerPort: 3888
          name: leader-election
        command:
        - bash
        - -c
        - |
          ORDINAL=${HOSTNAME##*-}
          export ZOOKEEPER_SERVER_ID=$((ORDINAL + 1))
          echo "Generated ZOOKEEPER_SERVER_ID=$ZOOKEEPER_SERVER_ID"
          /etc/confluent/docker/run
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: ZOOKEEPER_INIT_LIMIT
          value: "10"
        - name: ZOOKEEPER_SYNC_LIMIT
          value: "5"
        # Mở khóa các lệnh quản trị 4 chữ (Four Letter Words) để debug sau này
        - name: ZOOKEEPER_4LW_COMMANDS_WHITELIST
          value: "*"
        - name: ZOOKEEPER_SERVERS
          value: "zookeeper-0.zookeeper-headless.batch.svc.cluster.local:2888:3888;zookeeper-1.zookeeper-headless.batch.svc.cluster.local:2888:3888;zookeeper-2.zookeeper-headless.batch.svc.cluster.local:2888:3888"
        
        # --- THAY ĐỔI QUAN TRỌNG: Dùng TCP Socket thay vì Exec Command ---
        readinessProbe:
          tcpSocket:
            port: 2181
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 2181
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6