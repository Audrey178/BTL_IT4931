########################
# SINK: Kafka
########################
debezium.sink.type=kafka

# Kafka producer config (prefix "producer." sẽ được Debezium strip và pass xuống Kafka)
debezium.sink.kafka.producer.bootstrap.servers=kafka:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# Định dạng key/value gửi sang Kafka
debezium.format.key=json
debezium.format.value=json

########################
# SOURCE: PostgreSQL (busdb)
########################
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector

# Thông tin kết nối Postgres (phải trùng với service busdb trong docker-compose)
debezium.source.database.hostname=busdb
debezium.source.database.port=5432
debezium.source.database.user=admin
debezium.source.database.password=admin123
debezium.source.database.dbname=busdb

# Chủ đề (topic prefix) cho các bảng của database này
debezium.source.topic.prefix=busdb

# Logical decoding plugin
debezium.source.plugin.name=pgoutput

# Chỉ capture schema/bảng cần thiết
debezium.source.schema.include.list=public
debezium.source.table.include.list=public.bus_data

# Replication slot & publication
debezium.source.slot.name=debezium_busdb
debezium.source.slot.drop.on.stop=true
debezium.source.publication.autocreate.mode=filtered

# Snapshot lần đầu: đọc dữ liệu hiện có trong bảng
debezium.source.snapshot.mode=initial

########################
# Offset & schema history lưu ra file trong /debezium/data
########################
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schemahistory.dat
