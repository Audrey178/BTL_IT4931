version: "3.9"

services:
  # 1) PostgreSQL gốc của hệ thống thanh toán / bus_data
  busdb:
    image: postgres:16
    container_name: busdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: busdb
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - ./data/busdb:/var/lib/postgresql/data
      - ./docker/busdb-init.sql:/docker-entrypoint-initdb.d/busdb-init.sql:ro

  # 2) PostgreSQL riêng để lưu bảng window aggregated cho visualization
  envdb:
    image: postgres:16
    container_name: envdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: env_admin
      POSTGRES_PASSWORD: env_admin123
      POSTGRES_DB: envdb
      TZ: Asia/Bangkok
    ports:
      - "5433:5432"
    volumes:
      - ./data/envdb:/var/lib/postgresql/data
      - ./docker/envdb-init.sql:/docker-entrypoint-initdb.d/envdb-init.sql:ro

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  debezium_server:
    image: debezium/server:2.7.2.Final
    container_name: debezium_server
    restart: unless-stopped
    depends_on:
      - busdb
      - kafka
    ports:
      - "8081:8080"
    volumes:
      - ./debezium/conf/application.properties:/debezium/conf/application.properties:ro
    environment:
      QUARKUS_PROFILE: prod

  # 5) Python streamer: đọc chieudi.json, enrich, insert vào busdb.public.bus_data
  bus_streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bus_streamer
    depends_on:
      - busdb
    environment:
      DB_HOST: busdb
      DB_PORT: "5432"
      DB_NAME: busdb
      DB_USER: admin
      DB_PASSWORD: admin123

  # 6) Flink PyFlink job: Kafka -> window 10s -> envdb.public.bus_environment_window
  flink_env_job:
    build:
      context: .
      dockerfile: Dockerfile.flink_job
    container_name: flink_env_job
    depends_on:
      - kafka
      - envdb
    environment:
      # Có thể để ở Dockerfile, ở đây chỉ đảm bảo chắc chắn
      JDK_JAVA_OPTIONS: >-
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
        --add-opens=java.base/java.text=ALL-UNNAMED
        --add-opens=java.desktop/java.awt.font=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.net=ALL-UNNAMED
        -Duser.timezone=UTC

  # 6) Python window aggregator consumer
  window_aggregator:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: window_aggregator
    depends_on:
      - kafka
      - envdb
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: envdb
      DB_PORT: "5432"
      DB_NAME: envdb
      DB_USER: env_admin
      DB_PASSWORD: env_admin123
    restart: unless-stopped

networks:
  default:
    name: bus-net
