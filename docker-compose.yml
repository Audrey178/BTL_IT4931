services:
  # PostgreSQL: busdb
  busdb:
    image: postgres:16
    container_name: busdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: busdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  # Kafka (single node, KRaft)
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ./data/kafka:/var/lib/kafka/data

  # Debezium Server: Postgres -> Kafka
  debezium_server:
    image: debezium/server:2.7.2.Final
    container_name: debezium_server
    restart: unless-stopped
    depends_on:
      - busdb
      - kafka
    environment:
      JAVA_OPTS: "-Dquarkus.config.locations=file:/debezium/conf/application.properties"
    volumes:
      - ./debezium/conf:/debezium/conf # chứa application.properties
      - ./debezium/data:/debezium/data # chứa offsets / schema history

  # bus_streamer: đọc JSON, enrich, insert vào Postgres
  bus_streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bus_streamer
    depends_on:
      - busdb
    restart: "no"
    working_dir: /app
    command: ["python", "dags/stream_demo.py"]
    environment:
      BUSDB_HOST: busdb
      BUSDB_PORT: 5432
      BUSDB_NAME: busdb
      BUSDB_USER: admin
      BUSDB_PASSWORD: admin123
    volumes:
      - .:/app
